<!DOCTYPE html>
<html>
<body>
  <h1>WebAssembly Example</h1>
  <script>
    WebAssembly.instantiateStreaming(fetch("example.wasm"))
      .then(obj => {
        const mul_add = obj.instance.exports.mul_add;
        console.log("(2 * 3) + 4 ==", mul_add(2, 3, 4));
        window.mul_add = mul_add;
      })
      .catch(err => console.error(err));
  </script>
</body>
</html>
